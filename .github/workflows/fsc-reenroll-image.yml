name: fsc-reenroll-image
# fabric-ca-client v1.5.22 + the static `fsc-reenroll` helper (multiorg/fsc/reenroll) in a private image for the in-namespace FSC identity re-issue Jobs (fabricx S13 SAN fix).
# Same gates as rdbi-image.yml / tools-image.yml: base image pinned by digest, key scan of every layer with a path+sha256 allow-list bound to that base, SBOM, BuildKit SLSA provenance (mode=max).
# GAP (recorded): no signed attestation; GitHub offers it only for public or organization-owned private repositories, this one is user-owned and private (rdbi-image run 43083952563).
# The package is fsc-reenroll-ci (created and linked to this repo by GITHUB_TOKEN, private). Manual only: run it from the Actions tab (or `gh workflow run fsc-reenroll-image.yml`).
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: multiorg/fsc/reenroll/go.mod
      - name: Test and build the fsc-reenroll helper as a static binary
        working-directory: multiorg/fsc/reenroll
        run: |
          go vet ./... && go test ./...
          mkdir -p "$GITHUB_WORKSPACE/bin"
          CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/bin/fsc-reenroll" .
          out=$(ldd "$GITHUB_WORKSPACE/bin/fsc-reenroll" 2>&1 || true)
          grep -q "not a dynamic executable" <<<"$out"
          sha256sum "$GITHUB_WORKSPACE/bin/fsc-reenroll" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: fabric-ca-client v1.5.22 (release tarball, pinned sha256; the same release as the live fabric-ca image)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ca.tgz" https://github.com/hyperledger/fabric-ca/releases/download/v1.5.22/hyperledger-fabric-ca-linux-amd64-1.5.22.tar.gz
          echo "7f52ab98481ac0e4bfcf5b5aabfb403fa692ee100ae3b2ca3bf3f2152851573d  $RUNNER_TEMP/ca.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/ca.tgz" -C "$RUNNER_TEMP" bin/fabric-ca-client
          install -m 0755 "$RUNNER_TEMP/bin/fabric-ca-client" "$GITHUB_WORKSPACE/bin/fabric-ca-client"
          sha256sum "$GITHUB_WORKSPACE/bin/fabric-ca-client" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Build the image locally for the key scan (not pushed)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: bin
          file: multiorg/fsc/reenroll/Dockerfile
          load: true
          push: false
          tags: fsc-reenroll:scan
      - name: Scan the image layers for private keys
        run: |
          docker save fsc-reenroll:scan -o "$RUNNER_TEMP/image.tar"
          python3 panurus-itest/scripts/scan_image_keys.py "$RUNNER_TEMP/image.tar" --allow panurus-itest/k8s/scan-allow.txt --dockerfile multiorg/fsc/reenroll/Dockerfile | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: docker/build-push-action
        id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: bin
          file: multiorg/fsc/reenroll/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/fsc-reenroll-ci:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Assert the package is private
        env:
          PKG: fsc-reenroll-ci
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # public repo rule: the pushed package must NOT be pullable anonymously. Private = refused (401/403); 200, 404, 5xx or no answer fails the job (fail closed: an unknown package answers 403 at the token endpoint and 404 at the manifest).
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tok="$(curl -sS -m 30 "https://ghcr.io/token?scope=repository:${owner}/${PKG}:pull" | python3 -c 'import sys, json; print(json.load(sys.stdin).get("token", ""))')"
          code="$(curl -s -m 30 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${tok}" -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' "https://ghcr.io/v2/${owner}/${PKG}/manifests/${DIGEST}")"
          echo "anonymous manifest request for ${PKG}: HTTP ${code}"
          case "${code}" in
            401|403) echo "package ${PKG} is private" ;;
            *) echo "package ${PKG} is PUBLIC or unverifiable (HTTP ${code}): set it to private in the package settings"; exit 1 ;;
          esac
      - name: Pull test by digest (authenticated, fail-closed)
        env:
          PKG: fsc-reenroll-ci
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # the anonymous assert above proves only "not public" (an unknown package answers like a private one); that the image EXISTS is proven only by this authenticated pull of repo@digest.
          # The runner is logged in to ghcr.io already. The imageID must equal the pushed digest; it is printed so the later GO text can quote it.
          set -euo pipefail
          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${PKG}@${DIGEST}"
          docker pull "$ref"
          id="$(docker image inspect "$ref" --format '{{.Id}}')"
          echo "pulled ${ref} imageID ${id}" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$id" = "$DIGEST"
      # the repository is public, so the signed attestation is available (job permissions id-token + attestations)
      - if: ${{ github.event.repository.private == false }}
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/fsc-reenroll-ci
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Report the digest
        run: |
          { echo "image: ghcr.io/${{ github.repository_owner }}/fsc-reenroll-ci@${{ steps.build.outputs.digest }}"; echo "SBOM + BuildKit provenance attached; no signed attestation (private user repository)"; } | tee -a "$GITHUB_STEP_SUMMARY"
