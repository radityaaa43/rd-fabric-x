name: ci
on: pull_request
permissions:
  contents: read
jobs:
  cfgupdate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: multiorg/cfgupdate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: multiorg/cfgupdate/go.mod
      - run: go vet ./... && go test ./...
  namespaces:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m pip install pyyaml==6.0.1 && python3 -m unittest discover -s namespaces
  k8s-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m pip install pyyaml==6.0.1 && python3 -m unittest discover -s panurus-itest/scripts
  multiorg-s9:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m pip install pyyaml==6.0.1 && python3 -m unittest discover -s multiorg && python3 -m unittest discover -s multiorg/fca && python3 -m unittest discover -s multiorg/s10 && python3 -m unittest discover -s multiorg/lb && python3 -m unittest discover -s multiorg/arma && python3 -m unittest discover -s multiorg/gw
