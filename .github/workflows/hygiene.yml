name: hygiene
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  foreign-namespace-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: no foreign namespace names in the tracked tree
        run: python3 scripts/hygiene-foreign-ns.py
      - name: self-test of the check
        run: python3 scripts/hygiene-foreign-ns.py --selftest
