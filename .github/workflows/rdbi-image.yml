name: rdbi-image
# Rebuild of the rdbi-node image (FSC node + rdbi-driver, one image for the FSC pods and the fx-gw-<N> fxapi) from the pinned Panurus v0.24.0 plus
# our patches, with an SBOM and max provenance attached to the pushed image, and a signed GitHub attestation of its digest (final design S15 gate).
# The package is rdbi-node-ci (created and linked to this repo by GITHUB_TOKEN, private): the older package rdbi-node was pushed with a personal token, is not linked to this repo and stays untouched (run 43080311512: permission_denied: read_package).
# Manual only: run it from the Actions tab (or `gh workflow run rdbi-image.yml`); the job summary and the log print the image digest to pin in the renders.
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Clone Panurus v0.24.0 and check the pin
        run: |
          git clone -q --depth 1 --branch v0.24.0 https://github.com/LFDT-Panurus/panurus.git panurus
          test "$(git -C panurus rev-parse HEAD)" = 5f3c49e2d9e4507138ef330d34d60ec560fd1525
      - name: Check the patch set (exactly the accepted patches, byte for byte)
        working-directory: panurus-itest/patches
        run: |
          test "$(ls *.patch | sort | tr '\n' ' ')" = "$(grep -v '^#' ACCEPTED.sha256 | awk '{print $2}' | sort | tr '\n' ' ')"
          grep -v '^#' ACCEPTED.sha256 | sha256sum -c -
          { echo "patches applied to Panurus v0.24.0 (5f3c49e2):"; sha256sum *.patch; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: panurus/integration/go.mod
          cache: true
          cache-dependency-path: panurus/integration/go.sum
      - name: Patch Panurus and FSC, copy rdbi
        run: |
          (cd panurus/integration && go get gopkg.in/yaml.v3@v3.0.1 && go mod download github.com/hyperledger-labs/fabric-smart-client)
          make -C panurus-itest SRC="$PWD/panurus" WORK="$PWD" fsc-patch panurus-patch
          mkdir -p panurus/integration/token/fungible/rdbi
          cp -r panurus-itest/rdbi/. panurus/integration/token/fungible/rdbi/
      - name: go vet and go test
        working-directory: panurus/integration
        run: |
          go vet ./token/fungible/rdbi/award/... ./token/fungible/rdbi/cmd/driver/...
          go test -count=1 ./token/fungible/rdbi/award/... ./token/fungible/rdbi/cmd/driver/...
      - name: Build rdbi-node and rdbi-driver as static binaries (the runner glibc is newer than the image one)
        working-directory: panurus/integration
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/bin/rdbi-node" ./token/fungible/rdbi/cmd/node
          CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/bin/rdbi-driver" ./token/fungible/rdbi/cmd/driver
          for b in rdbi-node rdbi-driver; do
            out=$(ldd "$GITHUB_WORKSPACE/bin/$b" 2>&1 || true)
            grep -q "not a dynamic executable" <<<"$out"
          done
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Build the image locally for the key scan (not pushed)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: bin
          file: panurus-itest/k8s/Dockerfile
          load: true
          push: false
          tags: rdbi-node:scan
      - name: Scan the image layers for private keys
        run: |
          docker save rdbi-node:scan -o "$RUNNER_TEMP/image.tar"
          python3 panurus-itest/scripts/scan_image_keys.py "$RUNNER_TEMP/image.tar" --allow panurus-itest/k8s/scan-allow.txt --dockerfile panurus-itest/k8s/Dockerfile | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: docker/build-push-action
        id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: bin
          file: panurus-itest/k8s/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rdbi-node-ci:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Assert the package is private
        env:
          PKG: rdbi-node-ci
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # public repo rule: the pushed package must NOT be pullable anonymously. Private = refused (401/403); 200, 404, 5xx or no answer fails the job (fail closed: an unknown package answers 403 at the token endpoint and 404 at the manifest).
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tok="$(curl -sS -m 30 "https://ghcr.io/token?scope=repository:${owner}/${PKG}:pull" | python3 -c 'import sys, json; print(json.load(sys.stdin).get("token", ""))')"
          code="$(curl -s -m 30 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${tok}" -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' "https://ghcr.io/v2/${owner}/${PKG}/manifests/${DIGEST}")"
          echo "anonymous manifest request for ${PKG}: HTTP ${code}"
          case "${code}" in
            401|403) echo "package ${PKG} is private" ;;
            *) echo "package ${PKG} is PUBLIC or unverifiable (HTTP ${code}): set it to private in the package settings"; exit 1 ;;
          esac
      - name: Pull test by digest (authenticated, fail-closed)
        env:
          PKG: rdbi-node-ci
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # the anonymous assert above proves only "not public" (an unknown package answers like a private one); that the image EXISTS is proven only by this authenticated pull of repo@digest.
          # The runner is logged in to ghcr.io already. The imageID must equal the pushed digest; it is printed so the later GO text can quote it.
          set -euo pipefail
          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${PKG}@${DIGEST}"
          docker pull "$ref"
          id="$(docker image inspect "$ref" --format '{{.Id}}')"
          echo "pulled ${ref} imageID ${id}" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$id" = "$DIGEST"
      - name: Key scan of the PULLED digest (what the cluster will run)
        env:
          PKG: rdbi-node-ci
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # the scan before the push saw the local build; this one saves the image pulled by digest (same layers the cluster pulls) and applies the same allow-list and Dockerfile base rule
          set -euo pipefail
          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${PKG}@${DIGEST}"
          docker save "$ref" -o "$RUNNER_TEMP/pulled.tar"
          python3 panurus-itest/scripts/scan_image_keys.py "$RUNNER_TEMP/pulled.tar" --allow panurus-itest/k8s/scan-allow.txt --dockerfile panurus-itest/k8s/Dockerfile | tee -a "$GITHUB_STEP_SUMMARY"
      # the repository is public, so the signed attestation is available (job permissions id-token + attestations)
      - if: ${{ github.event.repository.private == false }}
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/rdbi-node-ci
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Report the digest
        run: |
          { echo "image: ghcr.io/${{ github.repository_owner }}/rdbi-node-ci@${{ steps.build.outputs.digest }}"; echo "SBOM + BuildKit provenance attached; no signed attestation (private user repository)"; } | tee -a "$GITHUB_STEP_SUMMARY"
