# Password from compose.yaml environment (SC_QUERY_DATABASE_PASSWORD).
server:
  endpoint: :5140
  tls: &tls
    mode: mtls
    cert-path: /config/tls/server.crt
    key-path: /config/tls/server.key
    ca-cert-paths: [/config/tls/ca.crt]
monitoring:
  endpoint: :5240
  tls: *tls
startup-timeout: 5m
database:
  endpoints: [db:5432]
  username: committer
  password: set-by-environment
  database: committer
  tls: {mode: none}
  max-connections: 10
  min-connections: 5
  load-balance: false
  retry: {initial-interval: 500ms, randomization-factor: 0.5, multiplier: 1.5, max-interval: 60s, max-elapsed-time: 15m}
min-batch-keys: 1024
max-batch-wait: 100ms
view-aggregation-window: 100ms
max-aggregated-views: 1024
max-active-views: 4096
max-view-timeout: 10s
max-request-keys: 10000
logging:
  logSpec: info:grpc=error
