# NodePorts for the four Arma assemblers (block delivery), so that the banks' committers outside the cluster can
# pull blocks from every party, as the routers already have NodePorts 30050..30350 for submission.
apiVersion: v1
kind: Service
metadata:
  name: orderer-assembler-1-nodeport
  namespace: fabricx
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: orderer-assembler-1}
  ports: [{name: rpc, port: 7052, targetPort: 7052, nodePort: 30052}]
---
apiVersion: v1
kind: Service
metadata:
  name: orderer-assembler-2-nodeport
  namespace: fabricx
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: orderer-assembler-2}
  ports: [{name: rpc, port: 7152, targetPort: 7152, nodePort: 30152}]
---
apiVersion: v1
kind: Service
metadata:
  name: orderer-assembler-3-nodeport
  namespace: fabricx
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: orderer-assembler-3}
  ports: [{name: rpc, port: 7252, targetPort: 7252, nodePort: 30252}]
---
apiVersion: v1
kind: Service
metadata:
  name: orderer-assembler-4-nodeport
  namespace: fabricx
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: orderer-assembler-4}
  ports: [{name: rpc, port: 7352, targetPort: 7352, nodePort: 30352}]
